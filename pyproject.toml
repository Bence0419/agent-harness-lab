[project]
name = "agent-harness-lab"
dynamic = ["version"]
description = "Reproducible CLI benchmark toolkit for AI coding-agent harnesses."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["benchmark", "coding-agents", "swe-bench", "reproducibility", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
ahl = "agent_harness_lab.cli.app:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/agent_harness_lab/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness_lab"]

# The source distribution carries the package, tests, docs and examples. The frozen research
# material (scripts/, configs/, experiments/, results/) stays in the git repository only.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/tools",
    "/README.md",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/CITATION.cff",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: opt-in tests that need a real Docker daemon (pytest -m docker, or AHL_DOCKER_TESTS=1)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["node_modules", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
